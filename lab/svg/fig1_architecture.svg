<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1280" height="780" fill="url(#bg)"/><text x="640" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">图1　AI 定向钓鱼杀伤链：从画像到点击</text><g filter="url(#shadow)"><rect x="70" y="110" width="230" height="150" rx="16" fill="#ffffff" stroke="url(#gRed)" stroke-width="2.5"/><rect x="70" y="110" width="230" height="40" rx="16" fill="url(#gRed)"/><rect x="70" y="130" width="230" height="20" fill="url(#gRed)"/><text x="185" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">攻击者 + LLM</text><text x="185" y="160" text-anchor="middle" font-size="13" fill="#7f1d1d">收集目标公开信息</text><text x="185" y="182" text-anchor="middle" font-size="13" fill="#7f1d1d">构造个性化画像</text><text x="185" y="204" text-anchor="middle" font-size="13" fill="#7f1d1d">驱动模型生成钓鱼邮件</text></g><g filter="url(#shadow)"><rect x="430" y="100" width="420" height="150" rx="16" fill="#ffffff" stroke="url(#gBlue)" stroke-width="2.5"/><rect x="430" y="100" width="420" height="40" rx="16" fill="url(#gBlue)"/><rect x="430" y="120" width="420" height="20" fill="url(#gBlue)"/><text x="640" y="127" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">AI 钓鱼邮件生成器</text><text x="640" y="150" text-anchor="middle" font-size="13" fill="#334155">输入: 目标画像 + 任务</text><text x="640" y="172" text-anchor="middle" font-size="13" fill="#334155">输出: 高仿真个性化邮件</text><text x="640" y="194" text-anchor="middle" font-size="13" fill="#334155">(姓名/部门/近期事项)</text></g><g filter="url(#shadow)"><rect x="980" y="100" width="230" height="270" rx="16" fill="#ffffff" stroke="url(#gAmber)" stroke-width="2.5"/><rect x="980" y="100" width="230" height="40" rx="16" fill="url(#gAmber)"/><rect x="980" y="120" width="230" height="20" fill="url(#gAmber)"/><text x="1095" y="127" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">投递通道</text><text x="1095" y="150" text-anchor="middle" font-size="13" fill="#334155">发件域名仿冒</text><text x="1095" y="172" text-anchor="middle" font-size="13" fill="#334155">链接域白名单绕过</text><text x="1095" y="194" text-anchor="middle" font-size="13" fill="#334155">绕过邮件网关</text></g><path d="M300,185 C350,185 380,175 428,175" stroke="#475569" stroke-width="3.5" fill="none" marker-end="url(#arrGray)"/><text x="358" y="165" text-anchor="middle" font-size="13.5" fill="#475569">画像</text><path d="M850,175 C900,175 940,175 978,175" stroke="#475569" stroke-width="3.5" fill="none" marker-end="url(#arrGray)"/><text x="915" y="160" text-anchor="middle" font-size="13.5" fill="#475569">发送</text><g filter="url(#shadow)"><rect x="70" y="330" width="300" height="130" rx="16" fill="#ffffff" stroke="url(#gGreen)" stroke-width="2.5"/><rect x="70" y="330" width="300" height="40" rx="16" fill="url(#gGreen)"/><rect x="70" y="350" width="300" height="20" fill="url(#gGreen)"/><text x="220" y="357" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">目标员工(8人)</text><text x="220" y="380" text-anchor="middle" font-size="13" fill="#334155">收到邮件</text><text x="220" y="402" text-anchor="middle" font-size="13" fill="#334155">基于可信度/警惕度</text><text x="220" y="424" text-anchor="middle" font-size="13" fill="#334155">决策是否点击</text></g><path d="M980,370 C900,370 700,420 372,395" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrRed)"/><text x="700" y="380" text-anchor="middle" font-size="13" fill="#dc2626">个性化邮件绕过网关直达收件箱</text><g filter="url(#shadow)"><rect x="70" y="520" width="300" height="140" rx="16" fill="#ffffff" stroke="url(#gRed)" stroke-width="2.5"/><rect x="70" y="520" width="300" height="40" rx="16" fill="url(#gRed)"/><rect x="70" y="540" width="300" height="20" fill="url(#gRed)"/><text x="220" y="547" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">受害者失陷</text><text x="220" y="570" text-anchor="middle" font-size="13" fill="#7f1d1d">凭证/内网入口泄露</text><text x="220" y="592" text-anchor="middle" font-size="13" fill="#7f1d1d">后续横向移动</text><text x="220" y="614" text-anchor="middle" font-size="13" fill="#7f1d1d">=A 链首环</text></g><path d="M370,460 C420,460 460,500 460,540" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrRed)"/><g filter="url(#shadow)"><rect x="430" y="520" width="420" height="140" rx="16" fill="#ffffff" stroke="url(#gAmber)" stroke-width="2.5"/><rect x="430" y="520" width="420" height="40" rx="16" fill="url(#gAmber)"/><rect x="430" y="540" width="420" height="20" fill="url(#gAmber)"/><text x="640" y="547" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">邮件安全网关</text><text x="640" y="570" text-anchor="middle" font-size="13" fill="#334155">关键词 + 发件域 + 链接域</text><text x="640" y="592" text-anchor="middle" font-size="13" fill="#334155">启发式打分</text><text x="640" y="614" text-anchor="middle" font-size="13" fill="#334155">PASS / REVIEW / BLOCK</text></g><path d="M850,590 C900,590 940,560 978,430" stroke="#d97706" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrAmber)"/><text x="960" y="520" text-anchor="middle" font-size="12.5" fill="#92400e">模板邮件 8/8 被拦</text><text x="640" y="745" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">▲ 个性化让「网关分数」与「受害者信任」同时下降——这正是 AI 钓鱼比群发更危险的根因</text></svg>