<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1280" height="780" fill="url(#bg)"/><text x="640" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">图4　实战验证：模板 vs 个性化（8 目标）</text><text x="360" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">到达收件箱(绕过网关)</text><rect x="300" y="660" width="90" height="0" rx="6" fill="url(#gGreen)"/><text x="345" y="648" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">0/8</text><text x="345" y="690" text-anchor="middle" font-size="13" fill="#334155">模板</text><rect x="440" y="300" width="90" height="360" rx="6" fill="url(#gRed)"/><text x="485" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">8/8</text><text x="485" y="690" text-anchor="middle" font-size="13" fill="#334155">个性化</text><text x="860" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">受害者点击数</text><rect x="800" y="660" width="90" height="0" rx="6" fill="url(#gGreen)"/><text x="845" y="648" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">0/8</text><text x="845" y="690" text-anchor="middle" font-size="13" fill="#334155">模板</text><rect x="940" y="525" width="90" height="135" rx="6" fill="url(#gRed)"/><text x="985" y="513" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">3/8</text><text x="985" y="690" text-anchor="middle" font-size="13" fill="#334155">个性化</text><line x1="220" y1="660" x2="1040" y2="660" stroke="#94a3b8" stroke-width="2"/><g filter="url(#shadow)"><rect x="260" y="180" width="760" height="200" rx="16" fill="#ffffff" stroke="url(#gBlue)" stroke-width="2.5"/><rect x="260" y="180" width="760" height="40" rx="16" fill="url(#gBlue)"/><rect x="260" y="200" width="760" height="20" fill="url(#gBlue)"/><text x="640" y="207" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">关键结论</text><text x="640" y="230" text-anchor="middle" font-size="13" fill="#0f172a">模板钓鱼: 网关拦截 8/8, 到达 0, 点击 0 —— 传统关键词网关即可压死</text><text x="640" y="252" text-anchor="middle" font-size="13" fill="#0f172a">个性化钓鱼: 网关放行 8/8, 到达 8, 点击 3 (点击率 37.5%)</text><text x="640" y="274" text-anchor="middle" font-size="13" fill="#0f172a">个性化让「网关放行率」从 0% 跳到 100%, 「点击率」从 0 到 37.5%</text><text x="640" y="296" text-anchor="middle" font-size="13" fill="#0f172a">——提升的不是技术, 而是「可信度」; 这正是 LLM 钓鱼研究的现实威胁</text></g></svg>